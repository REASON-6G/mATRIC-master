---
# Launch LiFi emulators per agent with `timeout`.
# Same variable contract as 5G/WiFi.

- hosts: localhost
  gather_facts: false
  vars:
    emulator_script: "/app/app/emulators/lifi_emulator.py"
    log_dir: "/var/log/emulators"

  tasks:
    - name: Ensure emulator log dir exists
      ansible.builtin.file:
        path: "{{ log_dir }}"
        state: directory
        mode: "0755"

    - name: Show execution plan
      ansible.builtin.debug:
        msg:
          job_number: "{{ job_number | default('') }}"
          agents: "{{ agents | map(attribute='ap_id') | list }}"
          num_devices: "{{ num_devices }}"
          duration_minutes: "{{ duration }}"

    - name: Launch LiFi emulator per agent (detached, duration-capped)
      ansible.builtin.shell: >
        set -euo pipefail;
        dur_sec=$(( {{ duration | int }} * 60 ));
        log="{{ log_dir }}/{{ item.ap_id }}.log";
        export EMU_PASSWORD="{{ item.password }}";
        nohup timeout "${dur_sec}s" python3 {{ emulator_script }}
          --ap-id "{{ item.ap_id }}"
          --devices "{{ num_devices }}"
          --lat "{{ item.location.lat }}"
          --lon "{{ item.location.lon }}"
          --duration-minutes "{{ duration | int }}"
          >> "$log" 2>&1 < /dev/null & disown
      args:
        executable: /bin/bash
      loop: "{{ agents }}"
      loop_control:
        label: "{{ item.ap_id }}"
